<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔋 Интерактивная батарейка знаний 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090d16;
            --card-bg: #1a2340;
            --text: #e8ecf4;
            --battery-border: #3a4a6b;
            --green: #22c55e;
            --yellow: #f59e0b;
            --red: #ef4444;
            --transition-speed: 0.8s;
        }

        body {
            height: 100vh;
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
              radial-gradient(ellipse at 50% 0%, rgba(56, 78, 130, 0.4) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 80%, rgba(34, 197, 94, 0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 20% 90%, rgba(239, 68, 68, 0.06) 0%, transparent 50%),
              var(--bg);
        }

        .game-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            max-width: 1100px;
            gap: 50px;
        }

        /* ЛЕВАЯ ПАНЕЛЬ: Заголовок и Управление */
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
            max-width: 550px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 20px rgba(100, 140, 255, 0.3);
        }

        .title span {
            display: inline-block;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .total-clicks-badge {
            font-size: 1.1rem;
            color: #8da2fb;
            font-weight: 600;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .btn-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 18px 20px;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            color: white;
            font-family: 'Fredoka', sans-serif;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s, opacity 0.3s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            text-align: left;
            line-height: 1.3;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active:not(:disabled) {
            transform: translateY(2px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            filter: grayscale(0.4);
            transform: none !important;
        }

        /* Ripple-эффект */
        .btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%,-50%);
            transition: width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
            opacity: 0;
        }
        .btn.clicked::after {
            width: 500px; height: 500px;
            opacity: 0;
        }

        .btn-green { background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #4ade80 100%); box-shadow: 0 6px 20px rgba(34,197,94,0.3); }
        .btn-yellow { background: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #fbbf24 100%); color: #1a1200; }
        .btn-red { background: linear-gradient(135deg, #b91c1c 0%, #ef4444 50%, #f87171 100%); box-shadow: 0 6px 20px rgba(239,68,68,0.3); }

        .btn-emoji {
            font-size: 1.5rem;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Счетчики */
        .counter {
            font-size: clamp(1.3rem, 2.5vw, 1.8rem);
            font-weight: 700;
            color: var(--text);
            background: var(--card-bg);
            border: 2px solid var(--battery-border);
            padding: 12px 20px;
            border-radius: 15px;
            min-width: 65px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* ПРАВАЯ ПАНЕЛЬ: Свободная батарейка без телефона */
        .right-panel {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 350px;
        }

        .battery-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .battery {
            position: relative;
            width: clamp(120px, 16vw, 160px);
            height: clamp(240px, 34vw, 340px);
            border: 6px solid var(--battery-border);
            border-radius: 24px;
            overflow: hidden;
            background: #0d1321;
            box-shadow:
              0 0 35px rgba(0,0,0,0.6),
              inset 0 0 30px rgba(0,0,0,0.4),
              0 0 60px var(--glow-color, transparent);
            transition: box-shadow var(--transition-speed) ease;
        }

        /* Коннектор батарейки (плюс сверху) */
        .battery::before {
            content: '';
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 16px;
            background: var(--battery-border);
            border-radius: 6px 6px 0 0;
            z-index: 2;
        }

        .battery-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10%;
            border-radius: 0 0 18px 18px;
            transition: height var(--transition-speed) cubic-bezier(.4,0,.2,1),
                        background var(--transition-speed) ease;
            background: linear-gradient(0deg, #1a5c2e 0%, #22c55e 100%);
            overflow: hidden;
        }

        /* Волна */
        .battery-fill::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -10%;
            width: 120%;
            height: 18px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: wave 2.5s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0) scaleX(1); opacity: 0.5; }
            50% { transform: translateY(-3px) scaleX(1.08); opacity: 0.8; }
        }

        /* Пузырьки */
        .bubbles {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-370px) scale(0.3); opacity: 0; }
        }

        /* Иконка молнии */
        .lightning {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2.5rem, 5vw, 4rem);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 5;
            filter: drop-shadow(0 0 15px rgba(255,255,100,0.6));
            pointer-events: none;
        }
        
        .lightning.visible {
            opacity: 1;
            animation: zap 1.5s ease-in-out infinite;
        }

        @keyframes zap {
            0%, 100% { transform: translate(-50%,-50%) scale(1); }
            50% { transform: translate(-50%,-50%) scale(1.15); }
        }

        /* Тексты */
        .percentage {
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            font-weight: 800;
            margin-top: 15px;
            text-align: center;
            transition: color var(--transition-speed) ease;
            color: var(--green);
        }

        .status-text {
            font-size: clamp(1rem, 2vw, 1.3rem);
            margin-top: 8px;
            text-align: center;
            opacity: 0.85;
            min-height: 2.5em;
            transition: color 0.4s ease, font-size 0.4s ease;
            line-height: 1.4;
            max-width: 320px;
        }

        /* Спецэффекты */
        .shake { animation: shake 0.5s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-1deg); }
            40% { transform: translateX(8px) rotate(1deg); }
            60% { transform: translateX(-5px) rotate(-0.5deg); }
            80% { transform: translateX(5px) rotate(0.5deg); }
        }

        .glow-pulse { animation: glowPulse 1.5s ease-in-out infinite; }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 35px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.4), 0 0 60px var(--glow-color); }
            50% { box-shadow: 0 0 35px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.4), 0 0 95px var(--glow-color); }
        }

        /* Искры */
        .particles-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFly 1.2s ease-out forwards;
        }
        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        /* Финальный праздничный салют */
        .victory-glow {
            text-shadow: 0 0 25px #4ade80 !important;
            color: #fff !important;
            animation: victoryScale 0.5s ease forwards;
        }
        @keyframes victoryScale {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @media (max-width: 850px) {
            .game-container {
                flex-direction: column-reverse;
                gap: 20px;
                overflow-y: auto;
                justify-content: flex-end;
            }
            .left-panel { max-width: 100%; width: 100%; }
            .right-panel { margin-top: 10px; }
            .title { text-align: center; }
            .total-clicks-badge { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="left-panel">
            <div class="title-block">
                <h1 class="title"><span>🔋</span> Батарейка знаний</h1>
                <div class="total-clicks-badge" id="totalClicksBadge">Всего ответов: 0 / 20</div>
            </div>
            
            <div class="buttons-wrapper">
                
                <div class="btn-container">
                    <button class="btn btn-green" id="btnGood" onclick="handleClick('good')">
                        <span class="btn-emoji">😎🔋</span> Всё понял!<br>
                        <span style="font-size: 0.75em; font-weight: 400; opacity: 0.9;">Всё получилось</span>
                    </button>
                    <div class="counter" id="countGood">0</div>
                </div>

                <div class="btn-container">
                    <button class="btn btn-yellow" id="btnMedium" onclick="handleClick('medium')">
                        <span class="btn-emoji">🤔💡</span> Есть вопросы<br>
                        <span style="font-size: 0.75em; font-weight: 400; opacity: 0.9;">Не всё понятно</span>
                    </button>
                    <div class="counter" id="countMedium">0</div>
                </div>

                <div class="btn-container">
                    <button class="btn btn-red" id="btnBad" onclick="handleClick('bad')">
                        <span class="btn-emoji">😰❓</span> Ничего не понял<br>
                        <span style="font-size: 0.75em; font-weight: 400; opacity: 0.9;">Было сложно</span>
                    </button>
                    <div class="counter" id="countBad">0</div>
                </div>

            </div>
        </div>

        <div class="right-panel">
            <div class="battery-wrapper">
                <div class="battery" id="battery">
                    <div class="battery-fill" id="batteryFill"></div>
                    <div class="bubbles" id="bubbles"></div>
                    <div class="lightning" id="lightning">⚡</div>
                </div>
                <div class="percentage" id="percentage">10%</div>
                <div class="status-text" id="statusText">Выбери, как прошёл урок 👇</div>
            </div>
        </div>

    </div>

    <div class="particles-container" id="particles"></div>

    <script>
        // Состояние приложения
        let charge = 10;
        let counts = { good: 0, medium: 0, bad: 0 };
        const MAX_CLICKS = 20;

        // Находим DOM элементы
        const batteryFill = document.getElementById('batteryFill');
        const percentageEl = document.getElementById('percentage');
        const statusText = document.getElementById('statusText');
        const batteryEl = document.getElementById('battery');
        const lightning = document.getElementById('lightning');
        const bubblesContainer = document.getElementById('bubbles');
        const particlesContainer = document.getElementById('particles');
        const totalClicksBadge = document.getElementById('totalClicksBadge');
        
        const btnGood = document.getElementById('btnGood');
        const btnMedium = document.getElementById('btnMedium');
        const btnBad = document.getElementById('btnBad');

        const countGoodEl = document.getElementById('countGood');
        const countMediumEl = document.getElementById('countMedium');
        const countBadEl = document.getElementById('countBad');

        // Банки случайных фраз (используются до блокировки)
        const greenTexts = [
            'Отлично! Заряд на максимуме! 🚀', 'Супер! Полный бак энергии! 💪', 'Мощь! Ты — батарейка-чемпион! 🏆',
            'Невероятно! Энергия просто зашкаливает! ⚡', 'Великолепно! Всё разложено по полочкам! 🔥',
            'Уровень — Бог математики! Так держать! 🧠', 'Абсолютный триумф! Система заряжена! 🌟'
        ];
        const yellowTexts = [
            'Неплохо! Но есть куда расти и развиваться 📈', 'Средний заряд — нужно чуть-чуть повторить 📖',
            'Почти идеально! Ещё капелька практики 🎯', 'Хорошее начало, продолжаем движение! 💫',
            'Половина пути пройдена — не останавливайся! 🌟', 'Нормальный рабочий заряд. Идём дальше ☕'
        ];
        const redTexts = [
            'Не переживай, всё самое интересное впереди! 🌈', 'Заряд маловат — но это легко исправить! 🔧',
            'Нужна мини-перезагрузка! Давай попробуем ещё раз 🔄', 'Давай разберёмся вместе на следующем шаге! 🤝',
            'Ничего страшного — завтра точно получится лучше! 🌅', 'Сигнал SOS принят! Будем подзаряжаться вместе 🆘'
        ];

        function getRandomText(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getGradient(level) {
            if (level >= 70) return 'linear-gradient(0deg, #14532d 0%, #16a34a 30%, #22c55e 60%, #4ade80 100%)';
            if (level >= 40) return 'linear-gradient(0deg, #78350f 0%, #d97706 30%, #f59e0b 60%, #fbbf24 100%)';
            return 'linear-gradient(0deg, #7f1d1d 0%, #b91c1c 30%, #ef4444 60%, #f87171 100%)';
        }

        function getGlowColor(level) {
            if (level >= 70) return 'rgba(34,197,94,0.5)';
            if (level >= 40) return 'rgba(245,158,11,0.4)';
            return 'rgba(239,68,68,0.5)';
        }

        function getTextColor(level) {
            if (level >= 70) return '#4ade80';
            if (level >= 40) return '#fbbf24';
            return '#f87171';
        }

        function createBubbles() {
            bubblesContainer.innerHTML = '';
            const count = Math.floor(charge / 6);
            for (let i = 0; i < count; i++) {
                const b = document.createElement('div');
                b.className = 'bubble';
                const size = 3 + Math.random() * 8;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = (5 + Math.random() * 90) + '%';
                b.style.animationDuration = (1.2 + Math.random() * 1.8) + 's';
                b.style.animationDelay = (Math.random() * 2) + 's';
                bubblesContainer.appendChild(b);
            }
        }

        function spawnParticles(x, y, color, count = 16) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 4 + Math.random() * 10;
                const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
                const dist = 45 + Math.random() * 90;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.background = color;
                p.style.boxShadow = `0 0 ${size}px ${color}`;
                p.style.setProperty('--tx', tx + 'px');
                p.style.setProperty('--ty', ty + 'px');
                
                particlesContainer.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        function triggerRipple(btn) {
            btn.classList.remove('clicked');
            void btn.offsetWidth;
            btn.classList.add('clicked');
            setTimeout(() => btn.classList.remove('clicked'), 600);
        }

        // ОБРАБОТКА КЛИКОВ
        function handleClick(type) {
            // Если лимит достигнут — полностью игнорируем любые вызовы
            let totalClicks = counts.good + counts.medium + counts.bad;
            if (totalClicks >= MAX_CLICKS) return;

            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            triggerRipple(btn);

            if (type === 'good') {
                counts.good++;
                let increase = (charge < 30) ? 25 : 15;
                charge = Math.min(100, charge + increase);
                spawnParticles(cx, cy, '#22c55e', 18);
                
                batteryEl.classList.remove('shake');
                batteryEl.classList.add('glow-pulse');
                setTimeout(() => { if((counts.good+counts.medium+counts.bad) < MAX_CLICKS) batteryEl.classList.remove('glow-pulse') }, 2400);
                
                statusText.textContent = getRandomText(greenTexts);
                statusText.style.color = '#4ade80';
            } 
            else if (type === 'medium') {
                counts.medium++;
                if (charge > 65) charge -= 15;
                else if (charge < 30) charge += 15;
                else charge -= 5;
                charge = Math.max(0, Math.min(100, charge));
                
                spawnParticles(cx, cy, '#f59e0b', 14);
                statusText.textContent = getRandomText(yellowTexts);
                statusText.style.color = '#fbbf24';
            } 
            else if (type === 'bad') {
                counts.bad++;
                charge = Math.max(0, charge - 25);
                spawnParticles(cx, cy, '#ef4444', 16);
                
                batteryEl.classList.remove('shake', 'glow-pulse');
                void batteryEl.offsetWidth;
                batteryEl.classList.add('shake');
                
                statusText.textContent = getRandomText(redTexts);
                statusText.style.color = '#f87171';
            }

            // Перепроверяем количество кликов после совершенного нажатия
            totalClicks = counts.good + counts.medium + counts.bad;
            
            if (totalClicks >= MAX_CLICKS) {
                handleVictoryState();
            } else {
                updateUI();
            }
        }

        // Логика при наступлении 23 нажатий
        function handleVictoryState() {
            // Блокируем кнопки на уровне HTML атрибутов
            btnGood.disabled = true;
            btnMedium.disabled = true;
            btnBad.disabled = true;

            // Заряд жестко фиксируем на 100%
            charge = 100;

            // Обновляем текстовые значения счетчиков
            countGoodEl.textContent = counts.good;
            countMediumEl.textContent = counts.medium;
            countBadEl.textContent = counts.bad;
            totalClicksBadge.textContent = `Всего ответов: ${MAX_CLICKS} / ${MAX_CLICKS} (Завершено)`;
            totalClicksBadge.style.color = '#4ade80';

            // Настраиваем визуал батарейки на супер-зеленый максимум
            batteryFill.style.height = '100%';
            batteryFill.style.background = 'linear-gradient(0deg, #14532d 0%, #16a34a 25%, #22c55e 60%, #4ade80 100%)';
            
            percentageEl.textContent = '100%';
            percentageEl.style.color = '#4ade80';
            
            batteryEl.style.setProperty('--glow-color', 'rgba(34,197,94,0.7)');
            batteryEl.classList.remove('shake');
            batteryEl.classList.add('glow-pulse'); // Оставляем пульсировать навсегда
            
            lightning.classList.add('visible');

            // Выводим финальный текст
            statusText.textContent = '🎉 Телефон полностью заряжен! Можно публиковать видео!';
            statusText.style.color = '#ffffff';
            statusText.classList.add('victory-glow');

            // Запускаем праздничный салют из зеленых и золотых искр из центра батарейки
            const rect = batteryEl.getBoundingClientRect();
            const bx = rect.left + rect.width / 2;
            const by = rect.top + rect.height / 2;
            
            spawnParticles(bx, by, '#4ade80', 25);
            setTimeout(() => spawnParticles(bx, by, '#fbbf24', 20), 300);
            setTimeout(() => spawnParticles(bx, by, '#22c55e', 20), 600);

            // Бурление пузырьков на максимум
            createBubbles();
        }

        function updateUI() {
            let totalClicks = counts.good + counts.medium + counts.bad;
            totalClicksBadge.textContent = `Всего ответов: ${totalClicks} / ${MAX_CLICKS}`;

            countGoodEl.textContent = counts.good;
            countMediumEl.textContent = counts.medium;
            countBadEl.textContent = counts.bad;

            batteryFill.style.height = charge + '%';
            batteryFill.style.background = getGradient(charge);
            
            percentageEl.textContent = Math.round(charge) + '%';
            percentageEl.style.color = getTextColor(charge);
            
            batteryEl.style.setProperty('--glow-color', getGlowColor(charge));

            if (charge >= 70) {
                lightning.classList.add('visible');
            } else {
                lightning.classList.remove('visible');
            }

            createBubbles();
        }

        // Старт инициализации
        createBubbles();
        updateUI();
    </script>
</body>
</html>
